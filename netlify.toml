[build]
  publish = "dist"
  command = "npm run build"


# -----------------------------------------------------------------
# DOMAIN MIGRATION: Permanent 301 redirect from old Netlify subdomain
# to the new custom domain. REQUIRED by Google Search Console
# "Change of Address" validation. The 'force = true' ensures this
# fires even if a matching file exists in the publish directory.
# -----------------------------------------------------------------
[[redirects]]
  from   = "https://portfoliojaimin.netlify.app/*"
  to     = "https://jaiminumaraniya.me/:splat"
  status = 301
  force  = true
# ─── Prerendered pages: one file per route, one canonical per page ───────────
# Every rewrite below points at the HTML produced by scripts/prerender.js.
# `force = true` guarantees the prerendered file always wins over Netlify's
# directory handling (e.g. "/projects" vs. the "/projects/" directory) — this
# is what previously made "/projects" fall back to the homepage shell and
# therefore report the homepage canonical.

# Collection + static pages
[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 200
  force = true

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200
  force = true

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200
  force = true

[[redirects]]
  from = "/refund-policy"
  to = "/refund-policy.html"
  status = 200
  force = true

# Detail pages (prerendered per content slug)
[[redirects]]
  from = "/projects/:slug"
  to = "/projects/:slug.html"
  status = 200
  force = true

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200
  force = true

# Private routes (admin / auth / tooling) — noindex, no canonical
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/app-shell.html"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
  force = true

[[redirects]]
  from = "/style-guide"
  to = "/style-guide.html"
  status = 200
  force = true

[[redirects]]
  from = "/seed"
  to = "/seed.html"
  status = 200
  force = true

# ─── Legacy URLs → permanent redirect to the canonical route ────────────────
[[redirects]]
  from = "/privacy"
  to = "/privacy-policy"
  status = 301
  force = true

[[redirects]]
  from = "/refund"
  to = "/refund-policy"
  status = 301
  force = true

# ─── Static SEO files: explicit pass-through BEFORE the SPA fallback ───────────
# These rules guarantee that Googlebot always receives the real static file,
# never the React index.html shell — even if a future build has a glitch.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200
  force = true

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/llms.txt"
  to = "/llms.txt"
  status = 200
  force = true

[[redirects]]
from = "/llms-full.txt"
to = "/llms-full.txt"
status = 200
force = true

[[redirects]]
from = "/ai-catalog.json"
to = "/ai-catalog.json"
status = 200
force = true

[[redirects]]
from = "/.well-known/ai-catalog.json"
to = "/.well-known/ai-catalog.json"
status = 200
force = true

[[redirects]]
from = "/.well-known/ard.json"
to = "/.well-known/ard.json"
status = 200
force = true

